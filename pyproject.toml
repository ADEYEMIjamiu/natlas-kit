[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "natlas-kit"
version = "0.1.0"
description = "Developer toolkit for N-ATLAS, Nigeria's multilingual LLM: SDK, CLI, REST API and eval harness"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Adeyemi Jamiu Adegbenro"}]
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
demo = ["streamlit>=1.35"]
dev = ["pytest>=8"]

[project.scripts]
natlas = "natlas_kit.cli:main"

[tool.setuptools.packages.find]
include = ["natlas_kit*"]

[tool.setuptools.package-data]
"natlas_kit.eval" = ["data/*.jsonl"]
